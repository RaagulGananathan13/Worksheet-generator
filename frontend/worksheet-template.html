<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeniusBees Worksheet - Addition with two digit numbers</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    @page {
      size: A4;
      margin: 0
    }

    body {
      font-family: 'Poppins', Arial, sans-serif;
      background: #e8e8e8;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .page {
      width: 210mm;
      min-height: 297mm;
      margin: 10mm auto;
      background: #fff;
      position: relative;
      overflow: hidden;
      box-shadow: 0 2px 20px rgba(0, 0, 0, .15);
      display: flex;
      flex-direction: column;
    }

    @media print {
      body {
        background: none
      }

      .page {
        margin: 0;
        box-shadow: none;
        width: 210mm;
        height: 297mm
      }
    }

    /* ═══════ HEADER ═══════ */
    .header { padding: 7mm 12mm 5mm 8mm; border-bottom: none; display: flex; gap: 15px; }
    .header-left { width: 120px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
    .header-left img { width: 140px; height: auto; display: block; margin-left: -10px; }
    .grade-table { border-collapse: collapse; margin-left: 4px; }
    .grade-table td { width: 40px; height: 35px; text-align: center; font-size: 18px; font-weight: 300; color: #555; border: none; }
    .grade-table tr:first-child td { border-bottom: 1px solid #777; }
    .grade-table td:not(:last-child) { border-right: 1px solid #777; }
    .header-mid { flex: 1; padding: 0 15px; display: flex; flex-direction: column; overflow: hidden; }
    .activity-id { font-size: 15px; font-weight: 700; color: #111; margin-bottom: 4px; }
    .activity-title { font-size: 14px; font-weight: 700; color: #111; margin-bottom: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .form-fields { display: flex; flex-direction: column; gap: 8px; }
    .form-row { display: flex; align-items: baseline; gap: 2px; font-size: 12px; color: #333; width: 100%; }
    .f-label { font-weight: 400; white-space: nowrap; color: #333; }
    .f-line-dashed { flex: 1; border-bottom: 1px dashed #555; margin-bottom: 4px; min-width: 20px; }
    .f-line-sm-dashed { width: 60px; border-bottom: 1px dashed #555; margin-bottom: 4px; }
    .d-line-dashed { width: 22px; border-bottom: 1px dashed #555; margin-bottom: 4px; }
    .d-line-y-dashed { width: 35px; border-bottom: 1px dashed #555; margin-bottom: 4px; }
    .d-sep { font-weight: 400; margin: 0 1px; color: #333; }
    .header-right { width: 125px; flex-shrink: 0; display: flex; align-items: flex-start; justify-content: flex-end; padding-top: 0; }
    .header-right img { width: 125px; height: 125px; display: block; }

    /* ═══════ BODY ═══════ */
    .body {
      flex: 1;
      position: relative;
      padding: 10mm 12mm;
      min-height: 190mm;
    }

    .wm-wrap {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .wm {
      position: absolute;
      width: 180px;
      opacity: 0.06;
      filter: grayscale(100%);
      pointer-events: none;
      user-select: none;
      transform: rotate(-15deg);
    }

    .wm1 {
      top: 20%;
      right: 12%;
    }

    .wm2 {
      top: 55%;
      left: 8%;
    }

    .wm3 {
      bottom: 10%;
      right: 15%;
    }

    .body-content {
      position: relative;
      z-index: 1
    }

    /* ═══════ FOOTER ═══════ */
    .footer {
      padding: 3mm 15mm 6mm 15mm;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Times New Roman', Times, serif;
      color: #111;
    }

    .footer-left {
      flex: 1;
      text-align: left;
      font-size: 10px;
      font-weight: 500;
    }

    .footer-center {
      flex: 2;
      text-align: center;
      font-size: 9px;
      font-weight: 500;
    }

    .footer-right {
      flex: 1;
      text-align: right;
      font-size: 10px;
      font-weight: bold;
    }

    .vertical-copyright {
      position: absolute;
      left: -193px;
      width: 400px;
      top: 50%;
      text-align: center;
      transform: translateY(-50%) rotate(90deg);
      font-family: 'Times New Roman', Times, serif;
      font-size: 10px;
      font-weight: 500;
      color: #111;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div class="page">

    <!-- ═══════ HEADER ═══════ -->
    <div class="header">

      <!-- LEFT: Logo + Grade Table -->
      <div class="header-left">
        <img src="logo.jpg" alt="GeniusBees">
        <table class="grade-table">
          <tr>
            <td>A+</td>
            <td>B+</td>
            <td>C</td>
          </tr>
          <tr>
            <td>A</td>
            <td>B</td>
            <td>D</td>
          </tr>
        </table>
      </div>

      <!-- MIDDLE: Activity Info + Form Fields -->
      <div class="header-mid">
        <div class="activity-id">Activity ID : 140100100001</div>
        <div class="activity-title">Addition with two digit numbers</div>
        <div class="form-fields">
          <div class="form-row">
            <span class="f-label" style="width: 45px; display: inline-block;">ID</span>
            <div class="f-line-dashed"></div>
          </div>
          <div class="form-row">
            <span class="f-label" style="width: 45px; display: inline-block;">Name</span>
            <div class="f-line-dashed"></div>
          </div>
          <div class="form-row">
            <span class="f-label" style="width: 45px; display: inline-block;">Date</span>
            <div class="d-line-dashed"></div>
            <span class="d-sep">/</span>
            <div class="d-line-dashed"></div>
            <span class="d-sep">/</span>
            <div class="d-line-y-dashed"></div>
            <span class="f-label" style="margin-left:12px">Start time</span>
            <div class="f-line-sm-dashed"></div>
            <span class="f-label" style="margin-left:12px">Finish time</span>
            <div class="f-line-dashed"></div>
          </div>
        </div>
      </div>

      <!-- RIGHT: QR Code -->
      <div class="header-right">
        <img src="image.png" alt="QR Code">
      </div>

    </div>

    <!-- ═══════ BODY ═══════ -->
    <div class="body">
      <div class="wm-wrap">
        <img src="watermark.svg" class="wm wm1" alt="Watermark">
        <img src="watermark.svg" class="wm wm2" alt="Watermark">
        <img src="watermark.svg" class="wm wm3" alt="Watermark">
      </div>
      <div class="body-content"></div>
    </div>

    <div class="vertical-copyright">Copyright&copy; 2026 GeniusBees Inc. All rights reserved.</div>

    <!-- ═══════ FOOTER ═══════ -->
    <div class="footer">
      <span class="footer-left">www.geniusbees.com</span>
      <span class="footer-center">This worksheet is for the use of registered Geniusbees.com students only.</span>
      <span class="footer-right">Page :1</span>
    </div>

  </div>
</body>

</html>
