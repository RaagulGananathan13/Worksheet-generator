<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GPT OCR Test</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bulma/0.9.4/css/bulma.min.css">
</head>
<body>
<section class="section">
    <div class="container">
        <h1 class="title">GPT Handwriting OCR Test</h1>
        <form id="ocr-form" action="/gpt-ocr" method="post" enctype="multipart/form-data">
            <div class="file has-name is-boxed">
                <label class="file-label">
                    <input class="file-input" type="file" name="image" accept="image/*" required>
                    <span class="file-cta">
                        <span class="file-icon">
                            <i class="fas fa-upload"></i>
                        </span>
                        <span class="file-label">Choose an image…</span>
                    </span>
                </label>
            </div>
            <br>
            <button class="button is-link" type="submit">Extract Text</button>
        </form>
        <br>
        <div id="result">
            {% if ocr_text %}
                <h2 class="subtitle">Extracted Text:</h2>
                <pre>{{ ocr_text }}</pre>
            {% endif %}
            {% if error %}
                <div class="notification is-danger">{{ error }}</div>
            {% endif %}
        </div>
    </div>
</section>
</body>
</html>
