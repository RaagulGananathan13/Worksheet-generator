<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Short Answer Box Setup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        #imageContainer {
            position: relative;
            display: inline-block;
            margin: 20px 0;
        }
        #worksheetPreview {
            max-width: 100%;
            max-height: 80vh;
            border: 1px solid var(--color-border);
        }
        .answer-box {
            position: absolute;
            border: 2px solid var(--color-accent-blue);
            background-color: rgba(47, 128, 237, 0.10);
            pointer-events: auto;
            cursor: pointer;
            border-radius: 4px;
            box-sizing: border-box;
            z-index: 10;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .answer-box.selected {
            border-width: 2px;
            box-shadow: 0 0 0 3px rgba(47, 128, 237, 0.4);
            z-index: 20;
        }
        .box-label {
            position: absolute;
            top: -20px;
            left: -2px;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            font-weight: bold;
            pointer-events: none;
            z-index: 30;
        }
        .box-number {
            background-color: var(--color-accent-blue);
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
        }
        .delete-box-btn {
            position: absolute;
            top: -10px;
            right: -10px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: #dc3545;
            color: white;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
            opacity: 0;
            transition: all 0.2s ease;
            pointer-events: auto;
            z-index: 40;
        }
        .answer-box:hover .delete-box-btn { opacity: 1; }
        .delete-box-btn:hover {
            background-color: #c82333;
            transform: scale(1.1);
        }
        #answersContainer { max-height: 500px; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1 class="mb-4">Short Answer Box Setup</h1>
        <div class="row">
            <div class="col-md-8">
                <div class="card mb-4">
                    <div class="card-header"><h5>Upload Worksheet</h5></div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="templateName" class="form-label">Template Name</label>
                            <input type="text" class="form-control" id="templateName" required>
                        </div>
                        <div class="mb-3">
                            <label for="worksheetImage" class="form-label">Upload Worksheet Image</label>
                            <input class="form-control" type="file" id="worksheetImage" accept="image/*" required>
                        </div>
                        <!-- Detection Settings section removed -->
                        <button id="detectBoxesBtn" class="btn btn-primary w-100" disabled>
                            <span id="detectBtnText">Detect Answer Boxes</span>
                            <span id="detectBtnSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                        </button>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5>Worksheet Preview</h5>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="showBoxesToggle" checked>
                            <label class="form-check-label" for="showBoxesToggle">Show Boxes</label>
                        </div>
                    </div>
                    <div class="card-body text-center">
                        <div id="imageContainer"><img id="worksheetPreview" class="img-fluid" style="display: none;"></div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header"><h5>Answer Boxes</h5></div>
                    <div class="card-body">
                        <div id="alertContainer"></div>
                        <div id="answersContainer"><p class="text-muted">No answer boxes detected yet. Upload an image and click 'Detect Answer Boxes'.</p></div>
                        <div class="d-grid gap-2 mt-3">
                            <button id="saveTemplateBtn" class="btn btn-success" disabled>Save Template</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        let answerBoxes = [];
        // File upload and preview
        document.getElementById('worksheetImage').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                if (!file.type.match('image.*')) {
                    alert('Please select a valid image file (JPEG, PNG, etc.)');
                    this.value = '';
                    return;
                }
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = document.getElementById('worksheetPreview');
                    img.onload = function() {
                        document.getElementById('detectBoxesBtn').disabled = false;
                        document.querySelectorAll('.answer-box').forEach(box => box.remove());
                        document.getElementById('answersContainer').innerHTML = '<p class="text-muted">No answer boxes detected yet. Click \'Detect Answer Boxes\' to find boxes.</p>';
                        answerBoxes = [];
                    };
                    img.src = event.target.result;
                    img.style.display = 'block';
                };
                reader.onerror = function() { alert('Error reading file. Please try again.'); };
                reader.readAsDataURL(file);
            }
        });
        document.getElementById('showBoxesToggle').addEventListener('change', function() {
            const boxes = document.querySelectorAll('.answer-box');
            boxes.forEach(box => { box.style.display = this.checked ? 'block' : 'none'; });
        });
        function showAlert(message, type = 'info') {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type} alert-dismissible fade show`;
            alertDiv.role = 'alert';
            alertDiv.innerHTML = `${message}<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>`;
            const alertContainer = document.getElementById('alertContainer');
            alertContainer.innerHTML = '';
            alertContainer.appendChild(alertDiv);
            setTimeout(() => { try { new bootstrap.Alert(alertDiv).close(); } catch {} }, 5000);
        }
        function setButtonLoading(button, isLoading) {
            const spinner = button.querySelector('.spinner-border');
            const buttonText = button.querySelector('span:not(.spinner-border)');
            if (isLoading) {
                button.disabled = true;
                spinner.classList.remove('d-none');
                if (buttonText) buttonText.textContent = 'Processing...';
            } else {
                button.disabled = false;
                spinner.classList.add('d-none');
                if (buttonText) buttonText.textContent = 'Detect Answer Boxes';
            }
        }
        document.getElementById('detectBoxesBtn').addEventListener('click', async function() {
            const fileInput = document.getElementById('worksheetImage');
            if (!fileInput.files.length) { showAlert('Please select an image file first', 'warning'); return; }
            const file = fileInput.files[0];
            if (!file.type.match('image.*')) { showAlert('Please select a valid image file (JPEG, PNG, etc.)', 'warning'); return; }
            const formData = new FormData();
            formData.append('file', file);
            setButtonLoading(this, true);
            try {
                // TODO: Replace endpoint with your SA box detection endpoint
                const response = await fetch('/api/sa-boxes/detect', { method: 'POST', body: formData });
                if (!response.ok) { const errorData = await response.json().catch(() => ({})); throw new Error(errorData.detail || 'Failed to detect answer boxes'); }
                const data = await response.json();
                if (!data.boxes || data.boxes.length === 0) { throw new Error('No answer boxes were detected. Please try a different image.'); }
                answerBoxes = data.boxes.map((box, index) => ({ ...box, id: `box_${index + 1}`, answer: '', keywords: '' }));
                answerBoxes.sort((a, b) => { if (Math.abs(a.y - b.y) < 20) { return a.x - b.x; } return a.y - b.y; });
                renderDetectedBoxes();
                updateAnswersList();
                document.getElementById('saveTemplateBtn').disabled = false;
                showAlert(`Detected ${answerBoxes.length} answer boxes`, 'success');
            } catch (error) {
                console.error('Detection error:', error);
                showAlert(error.message || 'Error detecting answer boxes', 'danger');
            } finally { setButtonLoading(this, false); }
        });
        function renderDetectedBoxes() {
            const container = document.getElementById('imageContainer');
            const img = document.getElementById('worksheetPreview');
            document.querySelectorAll('.answer-box').forEach(box => box.remove());
            if (!img.complete || !answerBoxes || answerBoxes.length === 0) return;
            const imgWidth = img.naturalWidth;
            const imgHeight = img.naturalHeight;
            const displayWidth = img.clientWidth;
            const displayHeight = img.clientHeight;
            const scaleX = displayWidth / imgWidth;
            const scaleY = displayHeight / imgHeight;
            answerBoxes.forEach((box, index) => {
                const boxElement = document.createElement('div');
                boxElement.className = 'answer-box';
                boxElement.dataset.id = box.id;
                const left = Math.round(box.x * scaleX);
                const top = Math.round(box.y * scaleY);
                const width = Math.round(box.width * scaleX);
                const height = Math.round(box.height * scaleY);
                boxElement.style.left = `${left}px`;
                boxElement.style.top = `${top}px`;
                boxElement.style.width = `${width}px`;
                boxElement.style.height = `${height}px`;
                const label = document.createElement('div');
                label.className = 'box-label';
                label.innerHTML = `<span class="box-number">${index + 1}</span>`;
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-box-btn';
                deleteBtn.innerHTML = '×';
                deleteBtn.title = 'Delete this box';
                deleteBtn.onclick = (e) => { e.stopPropagation(); if (confirm(`Are you sure you want to delete answer box ${index + 1}?`)) { deleteBox(box.id); } };
                boxElement.appendChild(label);
                boxElement.appendChild(deleteBtn);
                container.appendChild(boxElement);
            });
        }
        function updateAnswersList() {
            const container = document.getElementById('answersContainer');
            const saveBtn = document.getElementById('saveTemplateBtn');
            if (!answerBoxes || answerBoxes.length === 0) {
                container.innerHTML = '<p class="text-muted">No answer boxes detected. Click \'Detect Answer Boxes\' to find boxes.</p>';
                saveBtn.disabled = true;
                return;
            }
            let html = '<div class="list-group">';
            answerBoxes.forEach((box, index) => {
                html += `
                    <div class="list-group-item d-flex flex-column gap-2">
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="d-flex align-items-center">
                                <div class="me-2 d-flex align-items-center justify-content-center" style="width: 24px; height: 24px; background-color: #007bff; color: white; border-radius: 50%; font-size: 12px;">${index + 1}</div>
                                <div><div>${Math.round(box.width)} × ${Math.round(box.height)}px</div><div class="text-muted small">(${Math.round(box.x)}, ${Math.round(box.y)})</div></div>
                            </div>
                            <button class="btn btn-sm btn-outline-danger" onclick="event.stopPropagation(); if(confirm('Delete box ${index + 1}?')) deleteBox('${box.id}')" title="Delete this box">Delete</button>
                        </div>
                        <div class="mb-2">
                            <label for="answer_${box.id}" class="form-label mb-1">Model Answer (Paragraph)</label>
                            <textarea class="form-control form-control-sm answer-input" id="answer_${box.id}" rows="3" placeholder="Enter model answer (paragraph)" data-question-id="${box.id}" onchange="updateBoxAnswer('${box.id}', this.value)">${box.answer || ''}</textarea>
                        </div>
                        <div class="mb-2">
                            <label for="keywords_${box.id}" class="form-label mb-1">Keywords <span class="text-muted small">(comma separated)</span></label>
                            <input type="text" class="form-control form-control-sm keywords-input" id="keywords_${box.id}" placeholder="e.g. keyword1, keyword2" data-question-id="${box.id}" value="${box.keywords || ''}" onchange="updateBoxKeywords('${box.id}', this.value)">
                        </div>
                    </div>`;
            });
            html += '</div>';
            container.innerHTML = html;
            saveBtn.disabled = false;
        }
        function updateBoxAnswer(boxId, answer) {
            const box = answerBoxes.find(b => b.id === boxId);
            if (box) {
                box.answer = answer;
                const boxElement = document.querySelector(`.answer-box[data-id="${boxId}"]`);
                if (boxElement) {
                    if (answer) { boxElement.classList.add('has-answer'); } else { boxElement.classList.remove('has-answer'); }
                }
            }
        }
        function updateBoxKeywords(boxId, keywords) {
            const boxIdx = answerBoxes.findIndex(b => b.id === boxId);
            if (boxIdx !== -1) {
                answerBoxes[boxIdx].keywords = keywords;
            }
        }
        function deleteBox(boxId) {
            const boxIndex = answerBoxes.findIndex(box => box.id === boxId);
            if (boxIndex === -1) return;
            answerBoxes = answerBoxes.filter(box => box.id !== boxId);
            answerBoxes = answerBoxes.map((box, index) => ({ ...box, displayId: `box_${index + 1}` }));
            renderDetectedBoxes();
            updateAnswersList();
            showAlert(`Box deleted. ${answerBoxes.length} boxes remaining.`, 'info');
        }
        window.addEventListener('resize', () => { if (answerBoxes && answerBoxes.length > 0) { renderDetectedBoxes(); } });
        document.getElementById('saveTemplateBtn').addEventListener('click', async function() {
            const templateName = document.getElementById('templateName').value.trim();
            if (!templateName) { alert('Please enter a template name'); return; }
            if (answerBoxes.length === 0) { alert('No answer boxes detected'); return; }
            const fileInput = document.getElementById('worksheetImage');
            if (!fileInput.files || !fileInput.files[0]) { alert('Please select an image file'); return; }
            const file = fileInput.files[0];
            const templateId = `sa_${Date.now()}`;
            const img = document.getElementById('worksheetPreview');
            const imageDimensions = { width: img.naturalWidth, height: img.naturalHeight };
            const createdAt = new Date().toISOString();
            const imagePath = fileInput.files[0] ? fileInput.files[0].name : '';
            const boxData = answerBoxes.map((box, index) => {
                const rel_x = box.x / img.naturalWidth;
                const rel_y = box.y / img.naturalHeight;
                const rel_width = box.width / img.naturalWidth;
                const rel_height = box.height / img.naturalHeight;
                const area = box.width * box.height;
                return {
                    id: `Q${index + 1}`,
                    x: box.x,
                    y: box.y,
                    width: box.width,
                    height: box.height,
                    color: box.color || 'green',
                    answer: box.answer || '',
                    keywords: box.keywords || '',
                    relative_position: {
                        x: rel_x,
                        y: rel_y,
                        width: rel_width,
                        height: rel_height
                    },
                    area: area
                };
            });
            const answers = {};
            answerBoxes.forEach((box, index) => {
                const questionId = `Q${index + 1}`;
                const input = document.querySelector(`input[data-question-id="${box.id}"]`);
                const answer = input ? input.value.trim() : (box.answer || '');
                if (answer) { answers[questionId] = answer; }
            });
            const formData = new FormData();
            formData.append('template_id', templateId);
            formData.append('template_name', templateName);
            formData.append('created_at', createdAt);
            formData.append('image_path', imagePath);
            formData.append('image_dimensions', JSON.stringify(imageDimensions));
            formData.append('image', file);
            formData.append('boxes', JSON.stringify(boxData));
            formData.append('answers', JSON.stringify(answers));
            try {
                // TODO: Replace endpoint with your SA template save endpoint
                const response = await fetch('/api/sa-boxes/templates', { method: 'POST', body: formData });
                if (!response.ok) { throw new Error('Failed to save template'); }
                const result = await response.json();
                alert(`Template saved successfully with ID: ${result.template_id}`);
            } catch (error) {
                console.error('Error saving template:', error);
                alert('Error saving template: ' + error.message);
            }
        });
        document.addEventListener('DOMContentLoaded', function() {
            window.updateBoxKeywords = function(boxId, keywords) {
                const boxIdx = answerBoxes.findIndex(b => b.id === boxId);
                if (boxIdx !== -1) {
                    answerBoxes[boxIdx].keywords = keywords;
                }
            };
        });
    </script>
</body>
</html>
